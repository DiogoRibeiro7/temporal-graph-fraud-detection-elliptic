[tool.poetry]
name = "temporal-graph-fraud-detection-elliptic"
version = "0.1.0"
description = "Temporal graph fraud detection on the Elliptic Bitcoin transaction dataset."
authors = ["Diogo Ribeiro"]
readme = "README.md"
packages = [{ include = "graph_fraud", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = ">=2.1"
numpy = ">=1.24"
scipy = ">=1.10"
scikit-learn = ">=1.3"
networkx = ">=3.1"
matplotlib = ">=3.7"
joblib = ">=1.3"
kaggle = ">=1.6"
jupyter = ">=1.0"
ipykernel = ">=6.0"
DataExcept = ">=1.3,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
ruff = ">=0.5"
mypy = ">=1.8"
nbval = ">=0.11"

[tool.poetry.group.gnn]
optional = true

[tool.poetry.group.gnn.dependencies]
torch = ">=2.1,<3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
exclude = ["notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
